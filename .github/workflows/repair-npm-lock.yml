name: Repair npm lockfile on fix branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.ref == 'refs/heads/fix/vercel-deployment-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/vercel-deployment-readiness
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Refresh npm dependency lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already valid'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix: regenerate npm lockfile for deterministic installs'
          git push origin HEAD:fix/vercel-deployment-readiness
